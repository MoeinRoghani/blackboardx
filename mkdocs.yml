site_name: blackboardx
site_description: A skeletal blackboard system for Python.
site_url: https://moeinroghani.github.io/blackboardx/
repo_url: https://github.com/MoeinRoghani/blackboardx
copyright: Licensed under the Apache License, Version 2.0.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Get started:
      - Overview: index.md
      - Installation: install.md
      - Quickstart: quickstart.md
  - Concepts:
      - The board: concepts/board.md
      - The control component: concepts/control.md
      - The run: concepts/run.md
      - Running as a service: concepts/service.md
  - Guides:
      - Write an agent: guides/writing-an-agent.md
      - Write an admission rule: guides/admission-rules.md
      - End a run: guides/ending-a-run.md
      - Test an application: guides/testing.md
  - Reference: reference.md
  - About:
      - Contributing: about/contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

# The decision records stay in the repository and off the published site.
exclude_docs: |
  adr/
  design/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

watch:
  - src
  - README.md
  - CONTRIBUTING.md
