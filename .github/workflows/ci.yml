name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make setup
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - run: make lock-check
      - run: uv export --frozen --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uv run --frozen pip-audit --strict -r requirements-audit.txt

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - run: make setup
      - run: make docs

  adapters:
    name: adapters (postgres, mongodb)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: blackboard
          POSTGRES_PASSWORD: blackboard
          POSTGRES_DB: blackboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLACKBOARD_TEST_POSTGRES_DSN: postgresql://blackboard:blackboard@localhost:5432/blackboard
      BLACKBOARD_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      # A service container cannot initiate a replica set, and a MongoDB
      # transaction needs one, so this starts and initiates it by hand.
      - name: A single-node MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 30); do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' \
              && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for _ in $(seq 30); do
            docker exec mongo mongosh --quiet --eval 'rs.status().ok' \
              | grep -q 1 && break
            sleep 2
          done
          docker image inspect mongo:7.0 --format '{{index .RepoDigests 0}}'
      - run: make setup
      # Every adapter test runs here and none of them skips. A skip means a
      # server did not come up, and that would otherwise pass quietly.
      - name: The suite, with no adapter skipped
        shell: bash
        run: |
          uv run pytest -q -rs | tee report.txt
          ! grep -q SKIPPED report.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
