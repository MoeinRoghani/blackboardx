name: title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            ci
            build
            perf
            revert

  # The squash merge writes this body into the commit message, and
  # release-please parses that message. A parenthesis in the body defeats its
  # parser, and the failure is silent: the commit is dropped from the release
  # notes while every check stays green.
  body-parses:
    runs-on: ubuntu-latest
    # A bot writes its body from a template and has no author to teach, so the
    # rule applies to the people who can act on it. Commit 30f37e4 is a
    # Dependabot bump carrying ninety-six parentheses, and release-please cut
    # three releases after it without dropping anything.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: the body carries no parenthesis
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if printf '%s' "$BODY" | grep -n '[()]'; then
            echo
            echo "The lines above carry a parenthesis. The squash merge writes"
            echo "this body into the commit message, and release-please cannot"
            echo "parse a message that holds one: it drops the whole commit"
            echo "from the release notes without failing anything."
            echo
            echo "Write the body without parentheses. Commas, semicolons and"
            echo "separate sentences carry the same meaning, and the writing"
            echo "standard already prefers them."
            exit 1
          fi
          echo "no parenthesis in the body"
  breaking-carries-a-migration:
    runs-on: ubuntu-latest
    steps:
      - name: a breaking title carries a BREAKING CHANGE footer
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([a-z-]+\))?!:'; then
            echo "not a breaking title, nothing to check"
            exit 0
          fi
          if printf '%s' "$BODY" | grep -q '^BREAKING CHANGE:'; then
            echo "the body carries a BREAKING CHANGE footer"
            exit 0
          fi
          echo "This title carries a '!', so the body needs a BREAKING CHANGE footer."
          echo
          echo "The squash merge writes this body into the commit message, and the"
          echo "release notes are built from that message. Without the footer the"
          echo "release says a break happened and never says how to migrate."
          echo
          echo "Add a line starting with 'BREAKING CHANGE:' stating what changed and"
          echo "what a caller writes instead. CLAUDE.md requires both the '!' and the"
          echo "footer, not either."
          exit 1
