[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blackboardx"
version = "0.10.0"
description = "A skeletal blackboard system: the board and the control component, to which an application adds its agents and rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Moein Roghani", email = "moein.roghani@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
agent = ["httpx>=0.27"]
conformance = ["pytest>=8.3"]
mongodb = ["pymongo>=4.9"]
notifier = ["httpx>=0.27"]
postgres = ["psycopg[binary,pool]>=3.2"]

[project.urls]
Repository = "https://github.com/MoeinRoghani/blackboardx"

[dependency-groups]
dev = [
    "blackboardx[mongodb,notifier,postgres]",
    "mkdocs<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mypy>=1.14",
    "pip-audit>=2.10.1",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blackboard"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers -ra"
pythonpath = ["tests"]
